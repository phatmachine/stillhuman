services:
  payload:
    image: node:22-alpine
    working_dir: /app
    # Hostinger's deploy never runs `docker build`, so the app is fetched and built
    # on first start into the app-data volume. To redeploy new code: empty the volume
    # (docker volume rm stillhuman_app-data) and restart the project.
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache git libc6-compat
        if [ ! -f package.json ]; then
          git clone --depth 1 https://github.com/phatmachine/stillhuman.git /tmp/repo
          cp -a /tmp/repo/app/. /app/
        fi
        [ -d node_modules ] || npm install --legacy-peer-deps
        [ -d .next ] || npm run build
        exec npm start
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mongodb://stillhuman:${MONGO_PASSWORD}@mongo:27017/stillhuman?authSource=admin
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://stillhuman.si
    expose:
      - "3000"
    volumes:
      - app-data:/app
    depends_on:
      - mongo
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.stillhuman.rule=Host(`stillhuman.si`)
      - traefik.http.routers.stillhuman.entrypoints=websecure
      - traefik.http.routers.stillhuman.tls.certresolver=letsencrypt
      - traefik.http.routers.stillhuman.service=stillhuman
      - traefik.http.routers.stillhuman-www.rule=Host(`www.stillhuman.si`)
      - traefik.http.routers.stillhuman-www.entrypoints=websecure
      - traefik.http.routers.stillhuman-www.tls.certresolver=letsencrypt
      - traefik.http.routers.stillhuman-www.middlewares=stillhuman-www-redirect
      - traefik.http.routers.stillhuman-www.service=stillhuman
      - traefik.http.middlewares.stillhuman-www-redirect.redirectregex.regex=^https://www\.stillhuman\.si/(.*)
      - traefik.http.middlewares.stillhuman-www-redirect.redirectregex.replacement=https://stillhuman.si/$${1}
      - traefik.http.middlewares.stillhuman-www-redirect.redirectregex.permanent=true
      - traefik.http.services.stillhuman.loadbalancer.server.port=3000
    networks:
      - traefik-proxy
      - internal

  # Static Gaza site, served outside Payload at https://stillhuman.si/seeing-is-believing/
  # Content comes from gaza/prototype in the repo; restart the service to pick up changes.
  gaza:
    image: nginx:alpine
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache git
        git clone --depth 1 https://github.com/phatmachine/stillhuman.git /tmp/repo
        cp -a /tmp/repo/gaza/prototype/. /usr/share/nginx/html/
        printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  index scroll.html;\n  charset utf-8;\n  add_header X-Robots-Tag "noindex, nofollow" always;\n  location / { try_files $$uri $$uri/ =404; }\n}\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.gaza-slash.rule=Host(`stillhuman.si`) && Path(`/seeing-is-believing`)
      - traefik.http.routers.gaza-slash.priority=200
      - traefik.http.routers.gaza-slash.entrypoints=websecure
      - traefik.http.routers.gaza-slash.tls.certresolver=letsencrypt
      - traefik.http.routers.gaza-slash.middlewares=gaza-slash-redirect
      - traefik.http.routers.gaza-slash.service=gaza
      - traefik.http.middlewares.gaza-slash-redirect.redirectregex.regex=^(https://stillhuman\.si/seeing-is-believing)$$
      - traefik.http.middlewares.gaza-slash-redirect.redirectregex.replacement=$${1}/
      - traefik.http.routers.gaza.rule=Host(`stillhuman.si`) && PathPrefix(`/seeing-is-believing/`)
      - traefik.http.routers.gaza.priority=100
      - traefik.http.routers.gaza.entrypoints=websecure
      - traefik.http.routers.gaza.tls.certresolver=letsencrypt
      - traefik.http.routers.gaza.middlewares=gaza-strip
      - traefik.http.routers.gaza.service=gaza
      - traefik.http.middlewares.gaza-strip.stripprefix.prefixes=/seeing-is-believing
      - traefik.http.services.gaza.loadbalancer.server.port=80
    networks:
      - traefik-proxy

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: stillhuman
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - internal

networks:
  traefik-proxy:
    external: true
  internal:
    driver: bridge

volumes:
  mongo-data:
  app-data:
